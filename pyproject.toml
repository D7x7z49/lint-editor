# @path[pyproject.toml]

[project]
name = "lint-editor"
version = "0.1.0"
description = "pre-commit hook that enforces EditorConfig rules on text files and requires an explicit declaration for non-text files"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["pre-commit", "editorconfig", "lint", "formatting", "git", "code-quality"]
dependencies = [
    "editorconfig>=0.17.1",
]
authors = [
    {name = "D7x7z49", email = "85430783+D7x7z49@users.noreply.github.com"}
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
lint-editor = "lint_editor.cli:main"

[project.urls]
homepage = "https://github.com/D7x7z49/lint-editor"
issues = "https://github.com/D7x7z49/lint-editor/issues"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
