# @path[.github/workflows/ci.yml]
# continuous integration: static checks once, tests on every supported python

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: install dependencies
        run: uv sync --locked

      - name: validate the hook manifest
        run: uv run pre-commit validate-manifest .pre-commit-hooks.yaml

      - name: run the static checks
        run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: uv sync --locked

      - name: run the tests
        run: uv run pytest
