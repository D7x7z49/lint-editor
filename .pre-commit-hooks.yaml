# @path[.pre-commit-hooks.yaml]
- id: lint-editor
  name: check files against EditorConfig
  description: checks text files against EditorConfig rules and rejects non-text files without a .gitattributes declaration
  entry: lint-editor
  language: python
  types: [file]
  pass_filenames: true
  minimum_pre_commit_version: "3.2.0"
  stages: [pre-commit]

- id: lint-commit
  name: check the commit message against path rules
  description: derives the allowed commit types from the staged paths and checks the message
  entry: lint-commit
  language: python
  pass_filenames: true
  minimum_pre_commit_version: "3.2.0"
  stages: [commit-msg]

- id: lint-path
  name: check paths against .pathbase contracts
  description: checks the given paths against the path contract in each .pathbase file
  entry: lint-path
  language: python
  types: [file]
  minimum_pre_commit_version: "3.2.0"
  stages: [pre-commit]
