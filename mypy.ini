# @path[mypy.ini]

[mypy]
python_version = 3.12
# the strict flags are written out instead of using `strict = true`, because
# the strict alias may gain flags without notice.
warn_unused_configs = True
disallow_any_generics = True
disallow_any_unimported = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
implicit_optional = False
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_return_any = True
warn_unreachable = True
implicit_reexport = False
strict_equality = True
strict_equality_for_none = True
strict_bytes = True
local_partial_types = True
extra_checks = True
enable_error_code = ignore-without-code,possibly-undefined,redundant-expr,truthy-bool,unused-awaitable
